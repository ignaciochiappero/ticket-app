server {
    listen 80;
    root /usr/share/nginx/html;

    # Vite writes every hashed file here. These must 404 when they are missing:
    # falling back to index.html would answer a script request with HTML, and
    # the browser would report "unexpected token '<'" instead of the real
    # problem, which is a file that did not ship.
    location /assets/ {
        try_files $uri =404;
    }

    # A single-page app owns its routes: /login and /tickets are not files on
    # disk, so anything that does not resolve to one is handed to index.html
    # and React Router takes it from there. Without this, a deep link 404s and
    # only the front door works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
